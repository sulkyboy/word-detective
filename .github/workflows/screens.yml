name: screens

# 화면 확인: 에뮬레이터에 앱을 깔고 화면들을 띄워 찍은 그림을 screens 브랜치에 올린다.
# ui-check 브랜치에 올리거나 직접 실행할 때만 돈다 (설치 파일을 만드는 build-apk 와는 별개).
on:
  push:
    branches: [ ui-check ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (with the test-only screens)
        run: gradle :app:assembleDebug -PuiTest --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/ci_screens.sh

      - name: Publish screenshots to screens branch
        if: always()
        run: |
          mkdir -p shots && cd shots
          echo "run ${{ github.run_number }} (${{ github.sha }})" > RUN.txt
          git init -q -b screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "screens ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screens
