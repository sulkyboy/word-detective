name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk word-detective.apk
          cp app/build/outputs/apk/debug/app-debug.apk word-detective-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: word-detective-1.0.${{ github.run_number }}
          path: word-detective-1.0.${{ github.run_number }}.apk
          retention-days: 30

      # 설치 파일을 apk 브랜치에도 올려 git으로 바로 받을 수 있게 한다
      - name: Publish APK to apk branch
        run: |
          mkdir out && cp word-detective.apk out/
          cd out
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > version.json
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add word-detective.apk version.json
          git commit -q -m "APK build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
